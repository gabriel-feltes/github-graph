<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="RepoAI Viewer" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>RepoAI Viewer</title>
    <style>
      /* Estilos básicos para estruturar e adaptar o layout */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header,
      footer {
        background-color: #282c34;
        color: #fff;
        padding: 20px;
        text-align: center;
      }

      main {
        flex: 1;
        padding: 20px;
      }

      /* Centraliza o conteúdo e limita a largura */
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      /* Ajustes para dispositivos móveis */
      @media (max-width: 768px) {
        header,
        footer {
          padding: 15px;
          font-size: 14px;
        }
        main {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Cabeçalho informativo -->
    <header>
      <div class="container">
        <h1>RepoAI Viewer</h1>
        <p>
          Explore os conteúdos de Inteligência Artificial disponíveis no 
          <a href="https://github.com/Liga-IA/RepoAI" target="_blank" rel="noopener noreferrer">
            RepoAI
          </a>.
        </p>        
      </div>
    </header>

    <!-- Conteúdo principal: o React renderiza sua aplicação no "root" -->
    <main>
      <div id="root" class="container"></div>
    </main>

<!-- Rodapé informativo -->
<footer>
  <div class="container">
    <p>&copy; 2025 RepoAI. Todos os direitos reservados.</p>
    <p>
      Licenciado sob a 
      <a href="https://github.com/Liga-IA/RepoAI/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">
        Licença do GitHub
      </a>.
    </p>
  </div>
</footer>
