<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="RepoAI Viewer" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>RepoAI Viewer</title>
    <style>
      /* Estilos básicos para estruturar e adaptar o layout */
      * {
        box-sizing: border-box; /* Isso ajuda a evitar o overflow inesperado */
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden; /* Evitar rolagem horizontal */
        background-color: #f4f4f4; /* Fundo mais claro para contraste */
      }

      header,
      footer {
        background: linear-gradient(135deg, #282c34, #1a1d23); /* Gradiente para mais criatividade */
        color: #fff;
        padding: 20px;
        text-align: center;
        width: 100%;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Sombra sutil */
      }

      header h1 {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Sombra no texto para destaque */
      }

      main {
        flex: 1;
        padding: 20px;
        overflow: hidden; /* Prevenir rolagem excessiva */
        background-color: #fff; /* Fundo branco para o conteúdo principal */
        border-radius: 8px; /* Bordas arredondadas */
        margin: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Sombra sutil */
      }

      /* Centraliza o conteúdo e limita a largura */
      .container {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* Ajustes para dispositivos móveis */
      @media (max-width: 768px) {
        header,
        footer {
          padding: 15px;
          font-size: 14px;
        }

        main {
          padding: 15px;
          margin: 10px;
        }

        .container {
          padding: 0 15px;
        }
      }

      /* Ajustes para garantir que o conteúdo se ajuste bem em telas pequenas */
      @media (max-width: 480px) {
        header h1 {
          font-size: 1.5rem; /* Menor título em telas pequenas */
        }

        footer p {
          font-size: 12px; /* Fonte menor no rodapé */
        }
      }

      /* Links com contraste e hover effect */
      .exclusive-link {
      color: #6cd9f7;
      text-decoration: none;
      transition: color 0.3s ease;
      }

      .exclusive-link:hover {
        color: #33ff00;
      }
    </style>
  </head>
  <body>
    <!-- Cabeçalho informativo -->
    <header>
      <div class="container">
        <h1>RepoAI Viewer</h1>
        <p>
          Explore os conteúdos de Inteligência Artificial disponíveis no 
          <a href="https://github.com/Liga-IA/RepoAI" class="exclusive-link" target="_blank" rel="noopener noreferrer">
            RepoAI
          </a>.
        </p>        
      </div>
    </header>

    <!-- Conteúdo principal: o React renderiza sua aplicação no "root" -->
    <main>
      <div id="root" class="container"></div>
    </main>

    <!-- Rodapé informativo -->
    <footer>
      <div class="container">
        <p>&copy; 2025 RepoAI. Todos os direitos reservados.</p>
        <p>
          Licenciado sob a 
          <a href="https://github.com/Liga-IA/RepoAI/blob/main/LICENSE" class="exclusive-link" target="_blank" rel="noopener noreferrer">
            Licença do GitHub
          </a>.
        </p>
      </div>
    </footer>
  </body>
</html>
